name: indexnow

# Run by hand after a release that changes many pages.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated paths or URLs (empty = every URL in the sitemap)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs $URLS
        env:
          URLS: ${{ inputs.urls }}
