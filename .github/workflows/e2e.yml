name: e2e

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      # Fork PRs get no secrets, and every e2e test uses agent steps, so skip instead of failing.
      - name: Skip without a model key
        if: env.AI_GATEWAY_API_KEY == ''
        run: echo "::notice::AI_GATEWAY_API_KEY is unavailable (fork PR); e2e skipped. A maintainer runs it before merging."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.AI_GATEWAY_API_KEY != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.AI_GATEWAY_API_KEY != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.AI_GATEWAY_API_KEY != ''

      - name: Install browsers
        if: env.AI_GATEWAY_API_KEY != ''
        run: npx playwright install chromium --with-deps

      # The runner starts `npm run dev` itself (see e2e.config.ts). No app env vars are
      # provided on purpose: dev and prod share one database, so CI must never reach it.
      - name: Run e2e
        if: env.AI_GATEWAY_API_KEY != ''
        run: npx e2e run --reporter list,junit
        env:
          E2E_TELEMETRY_DISABLED: '1'

      - name: Upload report
        if: ${{ !cancelled() && env.AI_GATEWAY_API_KEY != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/logs/app.log
          if-no-files-found: warn

      - name: Upload artifacts
        if: ${{ !cancelled() && env.AI_GATEWAY_API_KEY != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: .e2e/artifacts
          if-no-files-found: warn
          retention-days: 7
